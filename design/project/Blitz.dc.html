<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Бліц</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4428B8}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; padding: 20px 24px; background: #EAF3FF; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #1E2440; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

  <div style="height: 64px; display: flex; align-items: center; gap: 16px">
    <a href="Map.dc.html" style="height: 52px; padding: 0 20px 0 14px; border-radius: 26px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: #4F5A78; text-decoration: none; box-shadow: 0 4px 0 #D3E0F5">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #4F5A78; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
      Карта
    </a>
    <span style="font-size: 28px; font-weight: 900">Бліц · × і :</span>
    <span style="font-size: 18px; font-weight: 800; color: #4F5A78">хвилина — скільки встигнеш</span>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 26px; background: #FFF6DC; font-size: 22px; font-weight: 900; color: #8A5A00; box-shadow: 0 4px 0 #F0DDA6">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #C98A00; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M7 4h10v5a5 5 0 0 1-10 0z M7 6H4v1a3 3 0 0 0 3 3 M17 6h3v1a3 3 0 0 1-3 3 M12 14v3 M8 21h8 M9 21l1-4h4l1 4"></path></svg>
      Рекорд 14
    </div>
  </div>

  <div style="display: flex; gap: 24px; flex-grow: 1; min-height: 0">
    <div style="flex-grow: 1; min-width: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 22px 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 6px 0 #D3E0F5">

      <div style="display: flex; align-items: center; gap: 28px">
        <div style="position: relative; width: 124px; height: 124px; flex-shrink: 0">
          <svg width="124" height="124" viewBox="0 0 124 124" aria-hidden="true" style="position: absolute; left: 0; top: 0"><circle cx="62" cy="62" r="52" fill="none" stroke="#E7EEF9" stroke-width="14"></circle><circle cx="62" cy="62" r="52" fill="none" stroke="#5B3FD6" stroke-width="14" stroke-linecap="round" stroke-dasharray="207 327" transform="rotate(-90 62 62)"></circle></svg>
          <div style="position: absolute; left: 0; top: 0; width: 124px; height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: center">
            <span style="font-size: 40px; line-height: 42px; font-weight: 900">38</span>
            <span style="font-size: 14px; font-weight: 800; color: #4F5A78">секунд</span>
          </div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: baseline; gap: 10px">
            <span style="font-size: 44px; line-height: 46px; font-weight: 900; color: #1E9E63">11</span>
            <span style="font-size: 22px; font-weight: 900">правильних</span>
          </div>
          <div style="position: relative; height: 20px; border-radius: 10px; background: #E7EEF9">
            <div style="width: 73%; height: 20px; border-radius: 10px; background: #1E9E63"></div>
            <div style="position: absolute; left: 93%; top: -6px; width: 6px; height: 32px; border-radius: 3px; background: #C98A00"></div>
          </div>
          <span style="font-size: 17px; font-weight: 800; color: #4F5A78">ще 4 — і буде новий рекорд</span>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 22px">
        <span style="font-size: 108px; line-height: 110px; font-weight: 900">24 : 6 =</span>
        <div style="width: 150px; height: 128px; border-radius: 26px; border: 5px solid #5B3FD6; background: #F1EDFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 92px; font-weight: 900; color: #3E27A3">
          4<span style="width: 5px; height: 76px; border-radius: 3px; background: #5B3FD6"></span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
        <span style="font-size: 15px; font-weight: 800; color: #4F5A78">Щойно:</span>
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="5">
          <span style="height: 40px; padding: 0 14px; border-radius: 20px; background: {{r.bg}}; color: {{r.fg}}; font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 8px">{{r.text}}<span style="font-size: 14px; font-weight: 800">{{r.note}}</span></span>
        </sc-for>
      </div>

      <div style="display: flex; align-items: flex-end; gap: 10px">
        <dc-import name="Pet" kind="dog" size="76" hint-size="76px,76px"></dc-import>
        <div style="border-radius: 18px 18px 18px 4px; background: #F1EDFF; padding: 10px 16px; font-size: 18px; font-weight: 800; color: #3E27A3">Ого, як швидко! Ділення — спершу скільки всього.</div>
      </div>
    </div>

    <div style="width: 324px; flex-shrink: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #D3E0F5">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="11">
          <button type="button" aria-label="{{k.aria}}" style="grid-column: span {{k.span}}; height: 80px; border-radius: 22px; border: 0; background: {{k.bg}}; box-shadow: 0 5px 0 {{k.shadow}}; font-family: inherit; font-size: 38px; font-weight: 900; color: #1E2440; cursor: pointer">{{k.label}}</button>
        </sc-for>
      </div>
      <button type="button" style="margin-top: auto; height: 84px; border-radius: 42px; border: 0; background: #1E9E63; color: #FFFFFF; font-family: inherit; font-size: 28px; font-weight: 900; box-shadow: 0 6px 0 #137447; cursor: pointer">Готово</button>
    </div>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: rgba(30, 36, 64, 0.45); display: flex; align-items: center; justify-content: center">
      <div style="width: 600px; box-sizing: border-box; border-radius: 32px; background: #FFFFFF; padding: 28px 36px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 10px 0 #D3E0F5">
        <span style="font-size: 22px; font-weight: 900; color: #4F5A78">Час вийшов!</span>
        <div style="display: flex; align-items: center; gap: 18px">
          <dc-import name="Pet" kind="dog" size="120" hint-size="120px,120px"></dc-import>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 64px; line-height: 66px; font-weight: 900; color: #1E9E63">15</span>
            <span style="font-size: 24px; font-weight: 900">правильних за хвилину</span>
          </div>
        </div>
        <div style="height: 56px; padding: 0 24px; border-radius: 28px; background: #FFF6DC; color: #8A5A00; font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 #F0DDA6">
          <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #C98A00; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M7 4h10v5a5 5 0 0 1-10 0z M7 6H4v1a3 3 0 0 0 3 3 M17 6h3v1a3 3 0 0 1-3 3 M12 14v3 M8 21h8 M9 21l1-4h4l1 4"></path></svg>
          Новий рекорд! Було 14
        </div>
        <div style="display: flex; gap: 12px; font-size: 18px; font-weight: 800; color: #4F5A78">
          <span style="height: 38px; padding: 0 14px; border-radius: 19px; background: #F7F9FE; display: flex; align-items: center; gap: 8px">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F5A524"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#FFD66B" stroke-width="2"></circle></svg>
            +5 за рекорд
          </span>
          <span style="height: 38px; padding: 0 14px; border-radius: 19px; background: #F1FAEC; color: #137447; display: flex; align-items: center">садочок полито: 12 фактів</span>
        </div>
        <div style="display: flex; gap: 14px; align-self: stretch; margin-top: 6px">
          <button type="button" style="flex: 1; height: 72px; border-radius: 36px; border: 0; background: #5B3FD6; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 900; box-shadow: 0 6px 0 #3E27A3; cursor: pointer">Ще раз</button>
          <a href="Map.dc.html" style="flex: 1; height: 72px; border-radius: 36px; background: #FFFFFF; border: 3px solid #E3EAF7; box-sizing: border-box; color: #4F5A78; font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">Карта</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["гра","результат"],"default":"гра"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { bg: '#E4F5EC', fg: '#137447', note: '' };
    const recent = [
      { ...ok, text: '3 × 7 = 21' },
      { ...ok, text: '20 : 5 = 4' },
      { bg: '#FFF0E6', fg: '#B4560A', text: '28 : 4 = 7', note: 'не 6' },
      { ...ok, text: '6 × 5 = 30' },
      { ...ok, text: '4 × 4 = 16' }
    ];
    const digit = (d) => ({ label: d, aria: d, bg: '#F2F6FD', shadow: '#D3DEF2', span: 1 });
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(digit);
    keys.push({ label: '⌫', aria: 'Стерти', bg: '#FFF0E6', shadow: '#F5D2B8', span: 1 });
    keys.push({ ...digit('0'), span: 2 });
    return { recent, keys, done: (this.props.stage ?? 'гра') === 'результат' };
  }
}
</script>
</body>
</html>
