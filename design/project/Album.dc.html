<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Альбом наліпок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4428B8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 20px 24px; background: #EAF3FF; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #1E2440; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

  <div style="height: 64px; display: flex; align-items: center; gap: 16px">
    <a href="Map.dc.html" style="height: 52px; padding: 0 20px 0 14px; border-radius: 26px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: #4F5A78; text-decoration: none; box-shadow: 0 4px 0 #D3E0F5">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #4F5A78; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
      Карта
    </a>
    <span style="font-size: 28px; font-weight: 900">Альбом наліпок</span>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px; border-radius: 26px; background: #FFFFFF; font-size: 22px; font-weight: 900; box-shadow: 0 4px 0 #D3E0F5">
      <span>7 з 18</span>
      <div style="width: 160px; height: 14px; border-radius: 7px; background: #E7EEF9; overflow: hidden">
        <div style="width: 39%; height: 14px; border-radius: 7px; background: #5B3FD6"></div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 24px; flex-grow: 1; min-height: 0">
    <div style="flex-grow: 1; min-width: 0; box-sizing: border-box; border-radius: 28px; background: #FFFDF7; padding: 18px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #E8DFC6, inset 0 0 0 3px #F1E8CF">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 17px; font-weight: 900; color: #4F5A78">{{r.title}}</span>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
            <sc-for list="{{r.items}}" as="s" hint-placeholder-count="6">
              <button type="button" aria-label="{{s.aria}}" style="height: 158px; border-radius: 20px; border: {{s.frame}}; background: {{s.tile}}; padding: 10px 6px 8px; box-sizing: border-box; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer">
                <div style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 44px; background: {{s.bg}}; border: {{s.ring}}; box-sizing: border-box; box-shadow: {{s.shadow}}; transform: rotate({{s.tilt}}deg); display: flex; align-items: center; justify-content: center; position: relative">
                  <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{s.ink}}; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="{{s.icon}}"></path></svg>
                  <span style="position: absolute; font-size: {{s.glyphSize}}px; font-weight: 900; color: {{s.ink}}">{{s.glyph}}</span>
                </div>
                <span style="font-size: 15px; line-height: 18px; font-weight: 900; color: {{s.fg}}; text-align: center">{{s.name}}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="width: 324px; flex-shrink: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 6px 0 #D3E0F5">
      <div style="width: 168px; height: 168px; border-radius: 84px; background: #3FA34D; border: 6px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 0 0 4px #CDEBD2, 0 8px 0 #2E7D3A; transform: rotate(-6deg); display: flex; align-items: center; justify-content: center">
        <svg width="88" height="88" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 3l6 8h-3.5l4.5 6H5l4.5-6H6z M12 17v4"></path></svg>
      </div>
      <span style="font-size: 26px; font-weight: 900; text-align: center">Лісова корона</span>
      <span style="font-size: 18px; line-height: 24px; font-weight: 700; color: #4F5A78; text-align: center">За боса острова Додавання</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #E4F5EC; color: #137447; font-size: 16px; font-weight: 900; display: flex; align-items: center">20 листопада</span>

      <div style="display: flex; align-items: flex-end; gap: 10px; align-self: stretch">
        <dc-import name="Pet" kind="dog" size="84" hint-size="84px,84px"></dc-import>
        <div style="flex-grow: 1; border-radius: 18px 18px 18px 4px; background: #F1EDFF; padding: 10px 14px; font-size: 17px; line-height: 22px; font-weight: 800; color: #3E27A3">Наша перша корона! Наліпимо ще?</div>
      </div>

      <div style="margin-top: auto; align-self: stretch; border-radius: 20px; background: #F7F9FE; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 800; color: #4F5A78">Скоро нова наліпка</span>
        <span style="font-size: 19px; font-weight: 900">100 монеток</span>
        <div style="height: 16px; border-radius: 8px; background: #E7EEF9; overflow: hidden">
          <div style="width: 82%; height: 16px; border-radius: 8px; background: #F5A524"></div>
        </div>
        <span style="font-size: 15px; font-weight: 800; color: #4F5A78">82 з 100</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      flag: 'M5 21V4M5 4h12l-2.5 4 2.5 4H5',
      tree: 'M12 3l6 8h-3.5l4.5 6H5l4.5-6H6z M12 17v4',
      cactus: 'M10 21V5a2 2 0 0 1 4 0v16M10 13H8a2 2 0 0 1-2-2V8M14 11h2a2 2 0 0 0 2-2V6M6 21h12',
      lolly: 'M6 9a6 6 0 1 0 12 0a6 6 0 1 0-12 0M12 9a2.5 2.5 0 1 1 2.5 2.5M12 15v7',
      crystal: 'M7 3h10l4 6-9 12L3 9z M3 9h18 M12 21L8 9l4-6 4 6z',
      castle: 'M4 21V8h3v3h3V8h4v3h3V8h3v13z M10 21v-4a2 2 0 0 1 4 0v4',
      swap: 'M17 7H8a4 4 0 0 0 0 8h9 M14 4l3 3-3 3',
      triangle: 'M12 4l8.5 15h-17z',
      book: 'M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z',
      star: 'M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z',
      coin: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9',
      heart: 'M12 20s-7.5-4.5-7.5-10a4 4 0 0 1 7.5-2.4A4 4 0 0 1 19.5 10c0 5.5-7.5 10-7.5 10z',
      bag: 'M5 8h14l-1 13H6z M9 8V6a3 3 0 0 1 6 0v2',
      cal: 'M4 6h16v14H4z M4 10h16 M8 3v5 M16 3v5'
    };
    const tilts = [-6, 4, -3, 6, -4, 3];
    const mk = (list) => list.map(([name, how, color, icon, glyph, got], i) => got ? {
      name, aria: name + ' — є', bg: color, ring: '5px solid #FFFFFF', shadow: '0 0 0 3px ' + color + '55, 0 5px 0 rgba(30,36,64,0.18)',
      ink: '#FFFFFF', tilt: tilts[i], icon: glyph ? '' : P[icon], glyph: glyph || '', glyphSize: glyph && glyph.length > 2 ? 26 : 34,
      tile: '#FFFFFF', frame: '3px solid #F1E8CF', fg: '#1E2440'
    } : {
      name: how, aria: name + ' — ще немає: ' + how, bg: '#F2F6FD', ring: '3px dashed #C9D6EE', shadow: 'none',
      ink: '#A3AECB', tilt: 0, icon: glyph ? '' : P[icon], glyph: glyph || '', glyphSize: glyph && glyph.length > 2 ? 26 : 34,
      tile: 'transparent', frame: '3px dashed #E8DFC6', fg: '#6B7592'
    });
    const rows = [
      { title: 'Острови', items: mk([
        ['Перший рівень', 'пройди перший рівень', '#5B3FD6', 'flag', '', true],
        ['Лісова корона', 'переможи боса Додавання', '#3FA34D', 'tree', '', true],
        ['Пустельна корона', 'переможи боса Віднімання', '#D9861C', 'cactus', '', false],
        ['Цукеркова корона', 'переможи боса Множення', '#E0508E', 'lolly', '', false],
        ['Кришталева корона', 'переможи боса Ділення', '#3A8FD6', 'crystal', '', false],
        ['Корона замку', 'переможи боса Задач', '#7A5BD6', 'castle', '', false]
      ]) },
      { title: 'Уміння', items: mk([
        ['Перше перенесення', 'перенеси десяток', '#E8770E', '', '+1', true],
        ['Перше позичання', 'позич десяток', '#138A55', 'swap', '', false],
        ['Через нуль', 'віднімай від 400', '#2F6FED', '', '0', false],
        ['Порівну', 'розклади порівну', '#C2417A', '', ':', true],
        ['Сімейство фактів', 'склади 4 приклади', '#8A5BD6', 'triangle', '', false],
        ['Перша задача', 'розв\'яжи задачу', '#B5722A', 'book', '', false]
      ]) },
      { title: 'Старанність', items: mk([
        ['10 поспіль', '10 правильних поспіль', '#1E9E63', '', '10', true],
        ['Три зірки', 'пройди рівень на 3 зірки', '#E6A100', 'star', '', true],
        ['100 монеток', 'збери 100 монеток', '#D98A12', 'coin', '', false],
        ['Не здаюся', 'виправ помилку', '#E5484D', 'heart', '', true],
        ['Перша покупка', 'купи щось у магазині', '#2E9C9C', 'bag', '', false],
        ['Тиждень занять', 'займайся 7 різних днів', '#4F6BD6', 'cal', '', false]
      ]) }
    ];
    return { rows };
  }
}
</script>
</body>
</html>
