<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Хто грає?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4428B8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 48px; background: #EAF3FF; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #1E2440; display: flex; flex-direction: column; gap: 32px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 52px; line-height: 60px; font-weight: 900; letter-spacing: -0.5px">Хто сьогодні грає?</h1>
      <p style="margin: 0; font-size: 22px; font-weight: 700; color: #4F5A78">Торкнися своєї картки</p>
    </div>
    <a href="Parent.dc.html" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 26px; background: #FFFFFF; color: #4F5A78; font-size: 18px; font-weight: 800; text-decoration: none; box-shadow: 0 2px 0 #D3E0F5">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #4F5A78; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      Для батьків
    </a>
  </div>

  <div style="display: flex; gap: 32px; flex-grow: 1; min-height: 0">
    <div style="display: flex; gap: 24px; align-items: flex-start">
      <a href="Map.dc.html" style="width: 260px; height: 340px; box-sizing: border-box; border-radius: 32px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-decoration: none; color: #1E2440; box-shadow: 0 6px 0 #C9D9F2; border: 4px solid #FFFFFF">
        <div style="width: 180px; height: 180px; border-radius: 90px; background: #FFF1DE; display: flex; align-items: center; justify-content: center">
          <dc-import name="Pet" kind="dog" size="150" hint-size="150px,150px"></dc-import>
        </div>
        <span style="font-size: 36px; font-weight: 900; line-height: 40px">Марія</span>
        <span style="display: flex; gap: 12px; font-size: 18px; font-weight: 800; color: #4F5A78">
          <span style="display: flex; align-items: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFB400"></path></svg>42</span>
          <span style="display: flex; align-items: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F5A524"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#FFD66B" stroke-width="2"></circle></svg>128</span>
        </span>
      </a>
      <button type="button" style="width: 260px; height: 340px; box-sizing: border-box; border-radius: 32px; background: transparent; border: 4px dashed #A9BCE0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: inherit; color: #4F5A78; cursor: pointer">
        <span style="width: 96px; height: 96px; border-radius: 48px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #5B3FD6; stroke-width: 3; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
        <span style="font-size: 24px; font-weight: 900">Новий профіль</span>
      </button>
    </div>

    <div style="flex-grow: 1; min-width: 0; border-radius: 32px; background: #FFFFFF; padding: 32px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 6px 0 #C9D9F2">
      <h2 style="margin: 0; font-size: 30px; font-weight: 900">Новий профіль</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="kid-name" style="font-size: 18px; font-weight: 800; color: #4F5A78">Ім'я</label>
        <input id="kid-name" type="text" placeholder="Як тебе звати?" value="{{name}}" onChange="{{onName}}" style="height: 64px; box-sizing: border-box; border-radius: 20px; border: 3px solid #D3DEF2; padding: 0 20px; font-family: inherit; font-size: 26px; font-weight: 800; color: #1E2440; background: #F7FAFF; outline-color: #5B3FD6">
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 18px; font-weight: 800; color: #4F5A78">Обери улюбленця</span>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{pets}}" as="p" hint-placeholder-count="5">
            <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="height: 156px; box-sizing: border-box; border-radius: 24px; border: 4px solid {{p.ring}}; background: {{p.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 17px; font-weight: 800; color: #1E2440; cursor: pointer; padding: 8px 4px">
              <dc-import name="Pet" kind="{{p.kind}}" size="92" hint-size="92px,92px"></dc-import>
              <span>{{p.label}}</span>
            </button>
          </sc-for>
        </div>
      </div>
      <button type="button" style="margin-top: auto; height: 72px; border-radius: 36px; border: 0; background: #5B3FD6; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 900; box-shadow: 0 6px 0 #3E27A3; cursor: pointer">Створити профіль</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'dog', name: '' };
  }
  renderVals() {
    const list = [
      { kind: 'dog', label: 'Мальтіпу' },
      { kind: 'cat', label: 'Котик' },
      { kind: 'unicorn', label: 'Єдиноріг' },
      { kind: 'panda', label: 'Панда' },
      { kind: 'capybara', label: 'Капібара' }
    ];
    const pets = list.map((p) => {
      const on = this.state.picked === p.kind;
      return {
        ...p,
        pressed: on ? 'true' : 'false',
        ring: on ? '#5B3FD6' : '#E3EAF7',
        bg: on ? '#F1EDFF' : '#FFFFFF',
        pick: () => this.setState({ picked: p.kind })
      };
    });
    return {
      pets,
      name: this.state.name,
      onName: (e) => this.setState({ name: e.target.value })
    };
  }
}
</script>
</body>
</html>
