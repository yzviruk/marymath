<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Додавання в стовпчик</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4428B8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 20px 24px; background: #EAF3FF; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #1E2440; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

  <div style="height: 64px; display: flex; align-items: center; gap: 16px">
    <a href="Map.dc.html" style="height: 52px; padding: 0 20px 0 14px; border-radius: 26px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: #4F5A78; text-decoration: none; box-shadow: 0 4px 0 #D3E0F5">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #4F5A78; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
      Карта
    </a>
    <span style="font-size: 24px; font-weight: 900">Додавання · Рівень +5</span>
    <div style="flex-grow: 1; display: flex; justify-content: center; gap: 8px" aria-label="Завдання 5 з 10">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="10">
        <div style="width: {{d.w}}px; height: 14px; border-radius: 7px; background: {{d.bg}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px; border-radius: 26px; background: #FFFFFF; font-size: 22px; font-weight: 900; box-shadow: 0 4px 0 #D3E0F5">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F5A524"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#FFD66B" stroke-width="2"></circle></svg>
      140
    </div>
  </div>

  <dc-import name="NumberLine" path="6,10,13" labels="delta" hint-size="1232px,120px"></dc-import>

  <div style="display: flex; gap: 24px; flex-grow: 1; min-height: 0">

    <div style="width: 380px; flex-shrink: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #D3E0F5">
      <span style="font-size: 20px; font-weight: 900">Кружечки розрядів</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex-grow: 1">
        <div style="border-radius: 18px; background: #EEF4FF; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-size: 16px; font-weight: 900; color: #2F6FED">Сотні</span>
          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px">
            <sc-for list="{{hundreds}}" as="c" hint-placeholder-count="4">
              <div style="width: 46px; height: 46px; border-radius: 23px; background: #2F6FED; color: #FFFFFF; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center">100</div>
            </sc-for>
          </div>
        </div>
        <div style="border-radius: 18px; background: #EAF7F0; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-size: 16px; font-weight: 900; color: #138A55">Десятки</span>
          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px">
            <sc-for list="{{tens}}" as="c" hint-placeholder-count="8">
              <div style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; background: #138A55; border: {{c.ring}}; color: #FFFFFF; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center">10</div>
            </sc-for>
          </div>
          <span style="font-size: 13px; font-weight: 800; color: #3E27A3; text-align: center">+1 новий десяток</span>
        </div>
        <div style="border-radius: 18px; background: #FFF3E6; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-size: 16px; font-weight: 900; color: #B4520A">Одиниці</span>
          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px">
            <sc-for list="{{ones}}" as="c" hint-placeholder-count="3">
              <div style="width: 34px; height: 34px; border-radius: 17px; background: #E8770E; color: #FFFFFF; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center">1</div>
            </sc-for>
          </div>
        </div>
      </div>
      <div style="border-radius: 18px; background: #F1EDFF; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: #3E27A3">
        <span style="display: flex; gap: 2px" aria-hidden="true">
          <span style="width: 14px; height: 14px; border-radius: 7px; background: #E8770E"></span>
          <span style="width: 14px; height: 14px; border-radius: 7px; background: #E8770E"></span>
          <span style="width: 14px; height: 14px; border-radius: 7px; background: #E8770E"></span>
        </span>
        <span>10 одиниць = 1 десяток</span>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 6px 0 #D3E0F5">
      <div style="display: grid; grid-template-columns: 56px repeat(3, 96px); column-gap: 10px; row-gap: 4px; align-items: center; justify-items: center">
        <span></span>
        <span style="width: 44px; height: 32px; border-radius: 10px; background: #EEF4FF; color: #2F6FED; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center">С</span>
        <span style="width: 44px; height: 32px; border-radius: 10px; background: #EAF7F0; color: #138A55; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center">Д</span>
        <span style="width: 44px; height: 32px; border-radius: 10px; background: #FFF3E6; color: #B4520A; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center">О</span>

        <span></span>
        <span style="height: 36px"></span>
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #F1EDFF; border: 2px solid #5B3FD6; box-sizing: border-box; color: #3E27A3; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center" aria-label="перенесли 1 десяток">1</span>
        <span style="height: 36px"></span>

        <span></span>
        <span style="font-size: 76px; line-height: 84px; font-weight: 900; color: #2F6FED">3</span>
        <span style="font-size: 76px; line-height: 84px; font-weight: 900; color: #138A55">5</span>
        <span style="font-size: 76px; line-height: 84px; font-weight: 900; color: #B4520A">6</span>

        <span style="font-size: 60px; line-height: 84px; font-weight: 900; color: #4F5A78">+</span>
        <span style="font-size: 76px; line-height: 84px; font-weight: 900; color: #2F6FED">1</span>
        <span style="font-size: 76px; line-height: 84px; font-weight: 900; color: #138A55">2</span>
        <span style="font-size: 76px; line-height: 84px; font-weight: 900; color: #B4520A">7</span>
      </div>
      <div style="width: 380px; height: 5px; border-radius: 3px; background: #1E2440"></div>
      <div style="display: grid; grid-template-columns: 56px repeat(3, 96px); column-gap: 10px; justify-items: center">
        <span></span>
        <div style="width: 88px; height: 100px; box-sizing: border-box; border-radius: 20px; border: 3px dashed #B7C5E3; background: #F7FAFF"></div>
        <div style="width: 88px; height: 100px; box-sizing: border-box; border-radius: 20px; border: 4px solid #5B3FD6; background: #F1EDFF; box-shadow: 0 0 0 6px #E6E0FF; display: flex; align-items: center; justify-content: center" aria-label="зараз вводимо десятки">
          <div style="width: 5px; height: 58px; border-radius: 3px; background: #5B3FD6"></div>
        </div>
        <div style="width: 88px; height: 100px; box-sizing: border-box; border-radius: 20px; border: 3px solid #1E9E63; background: #EAF8EF; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 900; color: #B4520A">3</div>
      </div>
      <div style="margin-top: auto; align-self: stretch; display: flex; align-items: flex-end; gap: 12px">
        <dc-import name="Pet" kind="dog" size="72" hint-size="72px,72px"></dc-import>
        <div style="flex-grow: 1; border-radius: 22px 22px 22px 6px; background: #F1EDFF; padding: 14px 18px; font-size: 20px; line-height: 26px; font-weight: 800; color: #2A1F66">Одиниці готові! Тепер десятки: 5 + 2 і ще 1 перенесений.</div>
      </div>
    </div>

    <div style="width: 324px; flex-shrink: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #D3E0F5">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" aria-label="{{k.aria}}" style="height: 80px; border-radius: 22px; border: 0; background: {{k.bg}}; box-shadow: 0 5px 0 {{k.shadow}}; font-family: inherit; font-size: 38px; font-weight: 900; color: #1E2440; cursor: pointer">{{k.label}}</button>
        </sc-for>
      </div>
      <button type="button" style="margin-top: auto; height: 76px; border-radius: 38px; border: 0; background: #1E9E63; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 900; box-shadow: 0 6px 0 #137447; cursor: pointer">Перевірити</button>
      <button type="button" style="height: 52px; border-radius: 26px; border: 3px solid #E3EAF7; background: #FFFFFF; color: #4F5A78; font-family: inherit; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #4F5A78; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>
        Підказка
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = Array.from({ length: 10 }, (_, i) => ({
      w: i === 4 ? 36 : 14,
      bg: i < 4 ? '#1E9E63' : (i === 4 ? '#5B3FD6' : '#C9D6EE')
    }));
    const hundreds = [1, 2, 3, 4].map((i) => ({ i }));
    const tens = Array.from({ length: 8 }, (_, i) => ({ ring: i === 7 ? '4px solid #B9A8FF' : '0' }));
    const ones = [1, 2, 3].map((i) => ({ i }));
    const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
    const keys = digits.map((d) => ({ label: d, aria: d, bg: '#F2F6FD', shadow: '#D3DEF2' }));
    keys.push({ label: '⌫', aria: 'Стерти', bg: '#FFF0E6', shadow: '#F5D2B8' });
    keys.push({ label: '0', aria: '0', bg: '#F2F6FD', shadow: '#D3DEF2' });
    keys.push({ label: '↺', aria: 'Почати приклад знову', bg: '#F2F6FD', shadow: '#D3DEF2' });
    return { dots, hundreds, tens, ones, keys };
  }
}
</script>
</body>
</html>
