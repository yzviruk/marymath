<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Ділення: розклади порівну</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4428B8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 20px 24px; background: #EAF3FF; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #1E2440; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

  <div style="height: 64px; display: flex; align-items: center; gap: 16px">
    <a href="Map.dc.html" style="height: 52px; padding: 0 20px 0 14px; border-radius: 26px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: #4F5A78; text-decoration: none; box-shadow: 0 4px 0 #D3E0F5">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #4F5A78; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
      Карта
    </a>
    <span style="font-size: 24px; font-weight: 900">Ділення · Рівень :1 · Розклади порівну</span>
    <div style="flex-grow: 1; display: flex; justify-content: center; gap: 8px" aria-label="Завдання 4 з 10">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="10">
        <div style="width: {{d.w}}px; height: 14px; border-radius: 7px; background: {{d.bg}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px; border-radius: 26px; background: #FFFFFF; font-size: 22px; font-weight: 900; box-shadow: 0 4px 0 #D3E0F5">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F5A524"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#FFD66B" stroke-width="2"></circle></svg>
      137
    </div>
  </div>

  <dc-import name="NumberLine" path="12,9,6,3,0" labels="count" hint-size="1232px,120px"></dc-import>

  <div style="display: flex; gap: 24px; flex-grow: 1; min-height: 0">
    <div style="flex-grow: 1; min-width: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 18px 28px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 0 #D3E0F5">
      <div style="display: flex; align-items: center; gap: 14px">
        <button type="button" aria-label="Прочитати умову вголос" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; border: 0; background: #F1EDFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #5B3FD6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
        </button>
        <p style="margin: 0; font-size: 25px; line-height: 31px; font-weight: 900">12 яблук розклали порівну в 3 кошики. Скільки яблук у кожному кошику?</p>
      </div>

      <div style="display: flex; gap: 20px; justify-content: center">
        <sc-for list="{{baskets}}" as="b" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
            <div style="width: 220px; height: 112px; box-sizing: border-box; border-radius: 12px 12px 56px 56px; background: #F6DDB8; border-top: 10px solid #C98F4F; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 4px 8px; padding: 6px 24px">
              <sc-for list="{{b.apples}}" as="a" hint-placeholder-count="4">
                <svg width="42" height="42" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2-2-7-2-8 3s2 11 5 11c1.2 0 1.8-.6 3-.6s1.8.6 3 .6c3 0 6-6 5-11s-6-5-8-3z" fill="#E5484D"></path><path d="M12 7c0-2 1-4 3-5" stroke="#6B4423" stroke-width="1.8" fill="none" stroke-linecap="round"></path><path d="M13 4c2-1.5 4-1 5 0-1.5 1.5-3.5 1.5-5 0z" fill="#3FA34D"></path></svg>
              </sc-for>
            </div>
            <span style="font-size: 16px; font-weight: 800; color: #4F5A78">{{b.name}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; gap: 16px; justify-content: center">
        <span style="width: 92px; font-size: 15px; font-weight: 800; color: #4F5A78; text-align: right">усього</span>
        <div style="width: 600px; display: flex; flex-direction: column; gap: 6px">
          <div style="height: 40px; border-radius: 12px; background: #E6E0FF; border: 3px solid #5B3FD6; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #3E27A3">12</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <div style="height: 40px; border-radius: 12px; background: #FFE9D4; border: 3px solid #E8770E; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #9A4508">?</div>
            <div style="height: 40px; border-radius: 12px; background: #FFE9D4; border: 3px solid #E8770E; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #9A4508">?</div>
            <div style="height: 40px; border-radius: 12px; background: #FFE9D4; border: 3px solid #E8770E; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #9A4508">?</div>
          </div>
        </div>
        <span style="width: 92px; font-size: 15px; font-weight: 800; color: #4F5A78">3 рівні частини</span>
      </div>

      <div style="margin-top: auto; display: flex; align-items: flex-start; justify-content: center; gap: 14px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <div style="width: 104px; height: 88px; box-sizing: border-box; border-radius: 20px; background: #E6E0FF; border: 3px solid #5B3FD6; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 900; color: #3E27A3">12</div>
          <span style="font-size: 15px; font-weight: 800; color: #4F5A78">скільки всього</span>
        </div>
        <span style="height: 88px; display: flex; align-items: center; font-size: 56px; font-weight: 900">:</span>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <div style="width: 104px; height: 88px; box-sizing: border-box; border-radius: 20px; background: #F2F6FD; border: 3px solid #8C9BC0; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 900">3</div>
          <span style="font-size: 15px; font-weight: 800; color: #4F5A78">скільки кошиків</span>
        </div>
        <span style="height: 88px; display: flex; align-items: center; font-size: 56px; font-weight: 900">=</span>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <div style="width: 104px; height: 88px; box-sizing: border-box; border-radius: 20px; background: #FFF3E6; border: 4px solid #E8770E; box-shadow: 0 0 0 6px #FFE3C7; display: flex; align-items: center; justify-content: center">
            <div style="width: 5px; height: 52px; border-radius: 3px; background: #E8770E"></div>
          </div>
          <span style="font-size: 15px; font-weight: 800; color: #4F5A78">в одному кошику</span>
        </div>
      </div>
    </div>

    <div style="width: 324px; flex-shrink: 0; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #D3E0F5">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" aria-label="{{k.aria}}" style="height: 80px; border-radius: 22px; border: 0; background: {{k.bg}}; box-shadow: 0 5px 0 {{k.shadow}}; font-family: inherit; font-size: 38px; font-weight: 900; color: #1E2440; cursor: pointer">{{k.label}}</button>
        </sc-for>
      </div>
      <button type="button" style="margin-top: auto; height: 76px; border-radius: 38px; border: 0; background: #1E9E63; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 900; box-shadow: 0 6px 0 #137447; cursor: pointer">Перевірити</button>
      <button type="button" style="height: 52px; border-radius: 26px; border: 3px solid #E3EAF7; background: #FFFFFF; color: #4F5A78; font-family: inherit; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #4F5A78; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>
        Підказка
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = Array.from({ length: 10 }, (_, i) => ({
      w: i === 3 ? 36 : 14,
      bg: i < 3 ? '#1E9E63' : (i === 3 ? '#5B3FD6' : '#C9D6EE')
    }));
    const four = [1, 2, 3, 4].map((i) => ({ i }));
    const baskets = [
      { name: 'кошик 1', apples: four },
      { name: 'кошик 2', apples: four },
      { name: 'кошик 3', apples: four }
    ];
    const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
    const keys = digits.map((d) => ({ label: d, aria: d, bg: '#F2F6FD', shadow: '#D3DEF2' }));
    keys.push({ label: '⌫', aria: 'Стерти', bg: '#FFF0E6', shadow: '#F5D2B8' });
    keys.push({ label: '0', aria: '0', bg: '#F2F6FD', shadow: '#D3DEF2' });
    keys.push({ label: '↺', aria: 'Почати приклад знову', bg: '#F2F6FD', shadow: '#D3DEF2' });
    return { dots, baskets, keys };
  }
}
</script>
</body>
</html>
