<!doctype html>
<html lang="uk">
<head>

      <circle cx="77" cy="60" r="2.2" fill="#FFFFFF"></circle>

  <sc-if value="{{isUnicorn}}" hint-placeholder-val="{{false}}">

      <circle cx="22" cy="76" r="14" fill="#B79BFF"></circle>
      <circle cx="30" cy="98" r="12" fill="#8FD3FF"></circle>

      <circle cx="88" cy="78" r="5" fill="#FFB4D2" opacity="0.8"></circle>
    </svg>

  <sc-if value="{{isPanda}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 120 120" width="{{size}}" height="{{size}}" role="img" aria-label="Панда">
      <circle cx="28" cy="32" r="14" fill="#2A2F45"></circle>
      <circle cx="92" cy="32" r="14" fill="#2A2F45"></circle>
      <circle cx="60" cy="66" r="40" fill="#FFFFFF" stroke="#E3E7F0" stroke-width="3"></circle>

      <circle cx="86" cy="82" r="6" fill="#FFB4B4" opacity="0.7"></circle>
    </svg>
  </sc-if>
  <sc-if value="{{isCapy}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 120 120" width="{{size}}" height="{{size}}" role="img" aria-label="Капібара">
      <circle cx="32" cy="32" r="9" fill="#8E5C38"></circle>
      <circle cx="88" cy="32" r="9" fill="#8E5C38"></circle>
      <rect x="16" y="26" width="88" height="82" rx="40" fill="#B98256"></rect>
      <rect x="30" y="64" width="60" height="40" rx="20" fill="#9C6A43"></rect>

      <circle cx="30" cy="66" r="5" fill="#E89B8A" opacity="0.6"></circle>
      <circle cx="90" cy="66" r="5" fill="#E89B8A" opacity="0.6"></circle>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["dog","cat","unicorn","panda","capybara"],"default":"dog"},"size":{"editor":"int","min":32,"max":400,"default":200},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'dog';
    const s = this.props.size ?? 200;
    return {
      size: s,
      isDog: k === 'dog',
      isCat: k === 'cat',
      isUnicorn: k === 'unicorn',
      isPanda: k === 'panda',
      isCapy: k === 'capybara'
    };
  }
}
</script>
</body>
</html>
